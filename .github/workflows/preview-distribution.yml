name: Preview Distribution
on:
  push:
    branches:
      - preview
permissions:
  contents: write # write needed to push semantic-version tags (see "Determine semantic version" step)
  actions: write # needed to delete old workflow runs (see last step)

env:
  FIREBASE_TESTER_GROUP: "preview"
  # RELEASES_TO_KEEP: "1" # only used by the GitHub Release steps below

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags needed to compute the semantic version

      - name: Verify applicationId is a valid reverse-domain identifier
        run: |
          APP_ID=$(grep -oP '(?<=applicationId = ")[^"]+' android/app/build.gradle.kts)
          echo "Detected applicationId: $APP_ID"
          if ! echo "$APP_ID" | grep -qP '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            echo "::error::applicationId '$APP_ID' is not a valid lowercase reverse-domain identifier (e.g. com.noolure.app)."
            exit 1
          fi
          FIRST_SEGMENT=$(echo "$APP_ID" | awk -F. '{print $1}')
          LAST_SEGMENT=$(echo "$APP_ID" | awk -F. '{print $NF}')
          if echo "$LAST_SEGMENT" | grep -qP '^(com|net|org|io|gov|edu)$' && [ "$FIRST_SEGMENT" = "$LAST_SEGMENT" ]; then
            echo "::error::applicationId '$APP_ID' repeats its TLD as the last segment (e.g. com.foo.com) — pick a real reverse-domain identifier."
            exit 1
          fi
          echo "applicationId format OK."

      - name: Determine semantic version from commit messages
        run: |
          git fetch --tags --force

          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
            COMMIT_RANGE="HEAD"
          else
            COMMIT_RANGE="$LAST_TAG..HEAD"
          fi
          echo "Last version tag: $LAST_TAG"

          VERSION_CORE="${LAST_TAG#v}"
          MAJOR=$(echo "$VERSION_CORE" | cut -d. -f1)
          MINOR=$(echo "$VERSION_CORE" | cut -d. -f2)
          PATCH=$(echo "$VERSION_CORE" | cut -d. -f3)

          LOG_TEXT=$(git log "$COMMIT_RANGE" --pretty=format:'%s%n%b' 2>/dev/null || true)
          echo "Commits considered for version bump:"
          echo "$LOG_TEXT"

          BUMP="patch"
          if echo "$LOG_TEXT" | grep -qiE 'BREAKING[ _-]CHANGE|^[a-zA-Z]+(\([^)]*\))?!:'; then
            BUMP="major"
          elif echo "$LOG_TEXT" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          fi
          echo "Bump type: $BUMP"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          VERSION_TAG="v$VERSION_NAME"
          echo "New version: $VERSION_NAME (tag: $VERSION_TAG)"

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Decode Firebase config (google-services.json) from secret
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          test -s android/app/google-services.json || { echo "::error::android/app/google-services.json decoded empty — check the GOOGLE_SERVICES_JSON secret."; exit 1; }

      - name: Decode release keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          test -s android/app/release-keystore.jks || { echo "::error::android/app/release-keystore.jks decoded empty — check the ANDROID_KEYSTORE_BASE64 secret."; exit 1; }

      - name: Write key.properties for Gradle release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$STORE_PASSWORD" ] || { echo "::error::ANDROID_KEYSTORE_PASSWORD secret is empty."; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "::error::ANDROID_KEY_PASSWORD secret is empty."; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::ANDROID_KEY_ALIAS secret is empty."; exit 1; }
          {
            printf 'storePassword=%s\n' "${STORE_PASSWORD//\\/\\\\}"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD//\\/\\\\}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS//\\/\\\\}"
            printf 'storeFile=%s\n' "release-keystore.jks"
          } > android/key.properties

      - name: Build signed release APK
        run: |
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number=${{ github.run_number }}

      - name: Rename APK with semantic version
        run: |
          APK_DIR="build/app/outputs/flutter-apk"
          VERSIONED_APK="$APK_DIR/NooLure.$VERSION_NAME.apk"
          cp "$APK_DIR/app-release.apk" "$VERSIONED_APK"
          echo "APK_PATH=$VERSIONED_APK" >> "$GITHUB_ENV"
          echo "Versioned APK: $VERSIONED_APK"

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: Authenticate firebase-tools with the service account
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Build release notes (version + commit message + short SHA)
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DELIM="RELEASE_NOTES_EOF_$(date +%s%N)"
          {
            echo "RELEASE_NOTES<<$DELIM"
            printf 'v%s — %s (%s)\n' "$VERSION_NAME" "$COMMIT_MESSAGE" "$SHORT_SHA"
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      # --- GitHub Release publishing (currently disabled — not needed right now) ---
      # To re-enable: uncomment the 2 steps below and uncomment `RELEASES_TO_KEEP`
      # near the top of this file. `permissions.contents` is already `write`
      # (needed for semantic-version tags above), so no permission change needed.
      #
      # - name: Create GitHub Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: ${{ env.VERSION_TAG }}
      #     name: ${{ env.VERSION_TAG }}
      #     body: ${{ env.RELEASE_NOTES }}
      #     prerelease: true
      #     target_commitish: ${{ github.sha }}
      #     files: ${{ env.APK_PATH }}
      #
      # - name: Delete old GitHub Releases (keep newest ${{ env.RELEASES_TO_KEEP }})
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #   run: |
      #     gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
      #       --jq 'sort_by(.createdAt) | reverse | .[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .tagName' \
      #       | tail -n +$(( RELEASES_TO_KEEP + 1 )) \
      #       | while read -r TAG; do
      #           echo "Deleting old release: $TAG"
      #           gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
      #         done
      # --- end GitHub Release publishing ---

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
        run: |
          firebase appdistribution:distribute \
            "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --release-notes "$RELEASE_NOTES" \
            --groups "$FIREBASE_TESTER_GROUP"

      # Only reached once distribution succeeded — records this version as
      # "shipped" so the next run computes the next bump from here, not before it.
      - name: Push semantic version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"

      # Only reached if every step above succeeded — deletes all older runs of
      # THIS workflow, keeping just the run that just succeeded (this one).
      - name: Delete previous workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "${{ github.repository }}" --workflow preview-distribution.yml \
            --json databaseId --limit 100 --jq '.[].databaseId' | while read -r RUN_ID; do
              if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
                echo "Deleting old workflow run: $RUN_ID"
                gh run delete "$RUN_ID" --repo "${{ github.repository }}" || true
              fi
            done
