name: Preview Distribution
on:
  push:
    branches:
      - preview
permissions:
  contents: write

env:
  FIREBASE_TESTER_GROUP: "preview"

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next semantic version
        run: |
          git fetch --tags --force
          LAST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
            LAST_TAG="v$BASE_VERSION"
            RANGE=""
          else
            RANGE="$LAST_TAG..HEAD"
          fi
          echo "Base tag: $LAST_TAG"

          COMMITS=$(git log $RANGE --pretty=format:%s 2>/dev/null || true)
          BUMP=patch
          if echo "$COMMITS" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
            BUMP=major
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            BUMP=minor
          fi
          echo "Bump type: $BUMP"

          BASE="${LAST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          echo "Next version: $VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION_NAME" -m "Release v$VERSION_NAME"
          git push origin "v$VERSION_NAME"

      - name: Verify applicationId is a valid reverse-domain identifier
        run: |
          APP_ID=$(grep -oP '(?<=applicationId = ")[^"]+' android/app/build.gradle.kts)
          echo "Detected applicationId: $APP_ID"
          if ! echo "$APP_ID" | grep -qP '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            echo "::error::applicationId '$APP_ID' is not a valid lowercase reverse-domain identifier (e.g. com.noolure.app)."
            exit 1
          fi
          FIRST_SEGMENT=$(echo "$APP_ID" | awk -F. '{print $1}')
          LAST_SEGMENT=$(echo "$APP_ID" | awk -F. '{print $NF}')
          if echo "$LAST_SEGMENT" | grep -qP '^(com|net|org|io|gov|edu)$' && [ "$FIRST_SEGMENT" = "$LAST_SEGMENT" ]; then
            echo "::error::applicationId '$APP_ID' repeats its TLD as the last segment (e.g. com.foo.com) — pick a real reverse-domain identifier."
            exit 1
          fi
          echo "applicationId format OK."

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Decode Firebase config (google-services.json) from secret
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          test -s android/app/google-services.json || { echo "::error::android/app/google-services.json decoded empty — check the GOOGLE_SERVICES_JSON secret."; exit 1; }

      - name: Decode release keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          test -s android/app/release-keystore.jks || { echo "::error::android/app/release-keystore.jks decoded empty — check the ANDROID_KEYSTORE_BASE64 secret."; exit 1; }

      - name: Write key.properties for Gradle release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$STORE_PASSWORD" ] || { echo "::error::ANDROID_KEYSTORE_PASSWORD secret is empty."; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "::error::ANDROID_KEY_PASSWORD secret is empty."; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::ANDROID_KEY_ALIAS secret is empty."; exit 1; }
          {
            printf 'storePassword=%s\n' "${STORE_PASSWORD//\\/\\\\}"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD//\\/\\\\}"
            printf 'keyAlias=%s\n' "${KEY_ALIAS//\\/\\\\}"
            printf 'storeFile=%s\n' "release-keystore.jks"
          } > android/key.properties

      - name: Build signed release APK
        run: |
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number=${{ github.run_number }}

      - name: Rename APK with semantic version
        run: |
          APK_PATH="build/app/outputs/flutter-apk/NooLure.v$VERSION_NAME.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: Authenticate firebase-tools with the service account
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Build release notes (version + commit message + short SHA)
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DELIM="RELEASE_NOTES_EOF_$(date +%s%N)"
          {
            echo "RELEASE_NOTES<<$DELIM"
            printf 'v%s — %s (%s)\n' "$VERSION_NAME" "$COMMIT_MESSAGE" "$SHORT_SHA"
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
        run: |
          firebase appdistribution:distribute \
            "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --release-notes "$RELEASE_NOTES" \
            --groups "$FIREBASE_TESTER_GROUP"

      - name: Publish release record to Firebase Realtime Database
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          RELEASED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RECORD_PATH="$RUNNER_TEMP/release-record.json"
          jq -n \
            --arg version "$VERSION_NAME" \
            --argjson buildNumber "$RUN_NUMBER" \
            --arg apkFileName "NooLure.v$VERSION_NAME.apk" \
            --arg commitSha "$SHORT_SHA" \
            --arg releaseNotes "$RELEASE_NOTES" \
            --arg releasedAt "$RELEASED_AT" \
            '{version: $version, buildNumber: $buildNumber, apkFileName: $apkFileName, commitSha: $commitSha, releaseNotes: $releaseNotes, releasedAt: $releasedAt}' \
            > "$RECORD_PATH"

          VERSION_KEY=$(echo "$VERSION_NAME" | tr '.' '_')
          firebase database:set "/appReleases/$VERSION_KEY" "$RECORD_PATH" \
            --project "$FIREBASE_PROJECT_ID" -y
          firebase database:set "/appMeta/latestVersion" "$RECORD_PATH" \
            --project "$FIREBASE_PROJECT_ID" -y
