name: Android Firebase Distribution

on:
  push:
    branches: [preview, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FIREBASE_TESTER_GROUP: preview
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      # Flutter's included Gradle build needs Maven Central for Kotlin artifacts.
      - name: Add Maven Central to Flutter Gradle plugin resolution
        shell: bash
        run: |
          settings="$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"
          if ! grep -q '^pluginManagement' "$settings"; then
            sed -i '1i pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' "$settings"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle.kts', 'android/app/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart code
        run: flutter analyze --no-pub

      - name: Restore Firebase Android config
        env:
          CONFIG_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          test -n "$CONFIG_BASE64" || { echo '::error::GOOGLE_SERVICES_JSON secret is empty'; exit 1; }
          printf '%s' "$CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            test -n "${!name}" || { echo "::error::$name is empty"; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          test -s android/app/release-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=release-keystore.jks\n'
          } > android/key.properties

      - name: Build signed release APK
        run: flutter build apk --release --no-pub --build-number="${{ github.run_number }}"

      - name: Check APK output
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk" || { echo "::error::Missing $apk"; exit 1; }
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.37.0

      - name: Distribute APK to Firebase testers
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          test -n "$SERVICE_ACCOUNT_JSON" || { echo '::error::FIREBASE_SERVICE_ACCOUNT is empty'; exit 1; }
          test -n "$FIREBASE_APP_ID" || { echo '::error::FIREBASE_ANDROID_APP_ID is empty'; exit 1; }
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          notes="${GITHUB_REF_NAME} • ${GITHUB_SHA::7} • ${COMMIT_SUBJECT%%$'\n'*}"
          firebase appdistribution:distribute "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUP" \
            --release-notes "$notes"
